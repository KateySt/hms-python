{% extends "base.html" %}
{% block content %}
<h2 class="text-xl font-bold mb-4">Reset Password</h2>
<form action="/auth/reset-password" method="post" class="space-y-4">
    <input type="hidden" name="user_id" value="{{ user_id }}">
    <div>
        <label class="block mb-1">New Password:</label>
        <input type="password" name="password" class="border px-3 py-2 rounded w-full" required>
    </div>
    <button type="submit" class="bg-green-600 text-white px-4 py-2 rounded">Update password</button>
</form>
{% endblock %}
