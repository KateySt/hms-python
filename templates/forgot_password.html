{% extends "base.html" %}
{% block content %}
<h2 class="text-2xl font-semibold mb-4 text-center">Forgot password</h2>

<form action="/auth/forgot-password" method="post" class="bg-white p-6 rounded-lg shadow-md w-full max-w-sm mx-auto">
    <div class="mb-4">
        <label class="block text-gray-700 font-medium mb-2">Name:</label>
        <input type="text" name="name"
               class="border border-gray-300 rounded-lg w-full px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
               required>
    </div>

    <button type="submit"
            class="bg-blue-600 text-white py-2 px-4 rounded-lg hover:bg-blue-700 transition duration-200">
        Send
    </button>
</form>
{% endblock %}
