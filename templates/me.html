{% extends "base.html" %}
{% block content %}
<h2 class="text-2xl font-semibold mb-4 text-center">Profile</h2>
{% if user %}
<p class="block text-gray-700 font-medium mb-2"><strong>name:</strong> {{ user.name }}</p>
<a href="/auth/logout" class="bg-blue-600 text-white py-2 px-4 rounded-lg hover:bg-blue-700 transition duration-200">
    Logout
</a>
{% else %}
<p class="block text-gray-700 font-medium mb-2">You are not login. <a href="/auth/login" class="underlined">login</a></p>
{% endif %}
{% endblock %}
